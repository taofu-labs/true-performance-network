services:
  subtensor-localnet:
    image: ghcr.io/raofoundation/subtensor-localnet
    container_name: subtensor-localnet
    ports:
      - "9944:9944"
      - "9945:9945"
      - "9946:9946"
    # "True"  = fast-runtime: 250ms blocks (good for dev — fast epoch iteration)
    # "False" = non-fast-runtime: 12s blocks
    command: ["True"]
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1

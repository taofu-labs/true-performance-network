[project]
name = "tao-performance-network"
version = "4.1.36"
description = "TPN"
authors = [{ name = "taofu.xyz" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["common", "competition", "cli", "validator"]

[tool.uv.sources]
common = { workspace = true }
competition = { workspace = true }
cli = { workspace = true }
validator = { workspace = true }

[tool.uv.workspace]
members = ["shared/*", "src/*"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.1",
    "huggingface_hub>=1.2.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = [
    "shared/common/tests",
    "shared/competition/tests",
    "src/validator/tests",
    "src/cli/tests",
]
markers = [
    "integration: exercises real external deps (localnet); run manually, not part of default suite",
]
# Nothing carries the marker today: removing the precheck container left the
# whole suite runnable in-process. Kept so a future localnet test can opt out.
# Run those with: uv run python -m pytest -m integration
addopts = "-m 'not integration'"

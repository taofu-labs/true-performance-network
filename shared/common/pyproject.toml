[project]
name = "common"
version = "4.1.36"
description = "Common shared dependencies"
authors = [{ name = "tpn.xyz" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.11.3",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "bittensor>=11.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/common"]

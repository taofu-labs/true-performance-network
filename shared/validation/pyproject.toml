[project]
name = "validation"
version = "4.1.36"
description = "GGUF model provenance validation tools"
authors = [{ name = "tpn.xyz" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gguf>=0.19.0",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared/validation"]
